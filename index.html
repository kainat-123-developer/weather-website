<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Website</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>🌦️ Weather App</h1>
        <p>Check weather anywhere</p>
    </header>


    <!-- Main Content -->
    <main>

        <!-- Search Section -->
        <section id="search-section">

            <input
                type="text"
                id="city-input"
                placeholder="Enter city name"
            >

            <button id="search-button">
                Search 🔍
            </button>

            <button id="refresh-button">
                🔄 Refresh
            </button>

        </section>
        <p id="status-message"></p>


        <!-- Current Weather Section -->
        <section id="current-weather">

            <h2 id="location">
                Lahore, Pakistan
            </h2>

            <div id="weather-icon">
                ☀️
            </div>

            <h3 id="temperature">
                32°C
            </h3>

            <p id="condition">
                Sunny
            </p>

            <p id="last-updated">
                Last updated: --
            </p>

        </section>


        <!-- Weather Details -->
        <section id="weather-details">

            <div class="weather-detail">
                <h3>🌡️ Feels Like</h3>
                <p id="feels-like">34°C</p>
            </div>

            <div class="weather-detail">
                <h3>💧 Humidity</h3>
                <p id="humidity">45%</p>
            </div>

            <div class="weather-detail">
                <h3>💨 Wind Speed</h3>
                <p id="wind-speed">12 km/h</p>
            </div>

        </section>


        <!-- Forecast Section -->
        <section id="forecast">

        <h2>7-Day Forecast</h2>

        <div id="forecast-container"></div>

        </section>


        <!-- Temperature Unit -->
        <section id="temperature-unit">

            <button id="celsius-button">
                °C
            </button>

            <button id="fahrenheit-button">
                °F
            </button>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>Weather App © 2026</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
